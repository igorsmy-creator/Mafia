<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мафия Онлайн</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            background: linear-gradient(45deg, #ff6b6b, #ffd93d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .screen {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        .hidden {
            display: none;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #ffd93d;
            border-radius: 8px;
            background: rgba(0,0,0,0.3);
            color: #eee;
            font-size: 1.1em;
            margin-bottom: 15px;
        }

        button {
            background: linear-gradient(45deg, #ff6b6b, #ee5a6f);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1em;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            width: 100%;
            margin: 10px 0;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255,107,107,0.4);
        }

        button:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: linear-gradient(45deg, #4ecdc4, #44a3aa);
        }

        .game-code {
            text-align: center;
            font-size: 3em;
            font-weight: bold;
            color: #ffd93d;
            background: rgba(0,0,0,0.4);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            letter-spacing: 5px;
            border: 3px solid #ffd93d;
        }

        .player-list {
            margin: 20px 0;
        }

        .player-item {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            border-left: 4px solid #4ecdc4;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .player-item.host {
            border-left-color: #ffd93d;
        }

        .player-item.dead {
            opacity: 0.5;
            border-left-color: #ff6b6b;
        }

        .player-name {
            font-size: 1.2em;
            font-weight: bold;
        }

        .player-role {
            color: #ffd93d;
            font-size: 0.9em;
        }

        .player-status {
            font-size: 0.9em;
            color: #4ecdc4;
        }

        .phase-indicator {
            text-align: center;
            font-size: 2em;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            font-weight: bold;
        }

        .phase-night {
            background: linear-gradient(45deg, #2c3e50, #34495e);
            color: #ffd93d;
        }

        .phase-day {
            background: linear-gradient(45deg, #ffd93d, #ff9a3c);
            color: #1a1a2e;
        }

        .role-card {
            background: linear-gradient(135deg, rgba(255,107,107,0.2), rgba(255,217,61,0.2));
            border: 3px solid #ffd93d;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            margin: 30px 0;
        }

        .role-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .role-name {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .role-description {
            font-size: 1.1em;
            color: #4ecdc4;
        }

        .vote-section {
            background: rgba(255,107,107,0.1);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .vote-button {
            background: rgba(78,205,196,0.2);
            border: 2px solid #4ecdc4;
            padding: 15px;
            margin: 5px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1em;
            width: 100%;
        }

        .vote-button:hover:not(:disabled) {
            background: rgba(78,205,196,0.4);
        }

        .vote-button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .vote-count {
            display: inline-block;
            background: #ff6b6b;
            padding: 5px 10px;
            border-radius: 5px;
            margin-left: 10px;
        }

        .log {
            background: rgba(0,0,0,0.5);
            padding: 15px;
            border-radius: 10px;
            max-height: 200px;
            overflow-y: auto;
            margin: 20px 0;
        }

        .log-entry {
            padding: 8px;
            margin: 5px 0;
            border-left: 3px solid #ffd93d;
            background: rgba(255,217,61,0.1);
        }

        .announcement {
            text-align: center;
            font-size: 2em;
            padding: 30px;
            background: rgba(0,0,0,0.4);
            border-radius: 15px;
            margin: 20px 0;
            border: 2px solid #ffd93d;
        }

        .waiting-message {
            text-align: center;
            font-size: 1.3em;
            color: #4ecdc4;
            padding: 20px;
            font-style: italic;
        }

        .debug-info {
            background: rgba(255,255,0,0.1);
            border: 1px solid #ffd93d;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            font-size: 0.9em;
            font-family: monospace;
            word-break: break-all;
        }

        @media (max-width: 600px) {
            h1 { font-size: 2em; }
            .game-code { font-size: 2em; }
            .phase-indicator { font-size: 1.5em; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎭 МАФИЯ ОНЛАЙН 🎭</h1>
        
        <!-- Экран меню -->
        <div id="menuScreen" class="screen">
            <h2 style="text-align: center; margin-bottom: 20px;">Добро пожаловать!</h2>
            <input type="text" id="playerNameInput" placeholder="Введите ваше имя">
            <button onclick="createGame()">🎮 Создать игру</button>
            <button class="btn-secondary" onclick="showJoinScreen()"> Присоединиться к игре</button>
        </div>

        <!-- Экран присоединения -->
        <div id="joinScreen" class="screen hidden">
            <h2 style="text-align: center; margin-bottom: 20px;">Присоединение к игре</h2>
            <input type="text" id="gameCodeInput" placeholder="Код игры">
            <input type="text" id="joinNameInput" placeholder="Ваше имя">
            <button onclick="joinGame()">Присоединиться</button>
            <button class="btn-secondary" onclick="showMenuScreen()">← Назад</button>
        </div>

        <!-- Экран ожидания -->
        <div id="waitingScreen" class="screen hidden">
            <h2 style="text-align: center;">Ожидание игроков</h2>
            <div class="game-code" id="displayGameCode">----</div>
            <p style="text-align: center; margin: 20px 0;">Поделитесь этим кодом с друзьями</p>
            <div id="waitingPlayerList" class="player-list"></div>
            <div id="hostControls" class="hidden">
                <button id="startGameBtn" onclick="startGame()">🎲 Начать игру</button>
            </div>
            <div class="waiting-message">Ожидание других игроков...</div>
            <div id="debugInfo" class="debug-info hidden"></div>
        </div>

        <!-- Экран роли -->
        <div id="roleScreen" class="screen hidden">
            <div class="role-card">
                <div class="role-icon" id="roleIcon"></div>
                <div class="role-name" id="roleName">Ваша роль</div>
                <div class="role-description" id="roleDescription">Описание роли</div>
            </div>
            <div class="waiting-message">Дождитесь начала игры...</div>
        </div>

        <!-- Игровой экран -->
        <div id="gameScreen" class="screen hidden">
            <div id="phaseIndicator" class="phase-indicator"></div>
            
            <div id="announcement" class="announcement hidden"></div>
            
            <div id="actionPanel" class="hidden">
                <h3 style="text-align: center; margin-bottom: 15px; color: #ffd93d;">Выберите действие:</h3>
                <div id="targetSelection" style="display: grid; gap: 10px;"></div>
            </div>

            <div id="voteSection" class="vote-section hidden">
                <h3 style="text-align: center; margin-bottom: 15px;">🗳️ Голосование</h3>
                <div id="voteButtons" style="display: grid; gap: 10px;"></div>
            </div>

            <div id="playersList" class="player-list"></div>
            
            <div id="gameLog" class="log"></div>
        </div>

        <!-- Экран победителя -->
        <div id="winnerScreen" class="screen hidden">
            <h1 id="winnerTitle" style="text-align: center; margin-bottom: 30px;"></h1>
            <div id="finalRoles" class="player-list"></div>
            <button onclick="location.reload()">🔄 Новая игра</button>
        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <script>
        // ========== FIREBASE CONFIGURATION ==========
        // ЗАМЕНИТЕ НА ВАШИ ДАННЫЕ ИЗ FIREBASE CONSOLE
        const firebaseConfig = {


  apiKey: "AIzaSyD80aEmTGwNjW7x6YLxqB5QyjfMA8vs2D4",


  authDomain: "mafia-game-7f26e.firebaseapp.com",


  databaseURL: "https://mafia-game-7f26e-default-rtdb.europe-west1.firebasedatabase.app",


  projectId: "mafia-game-7f26e",


  storageBucket: "mafia-game-7f26e.firebasestorage.app",


  messagingSenderId: "182626561753",


  appId: "1:182626561753:web:a25db8e9fbe5b940bfd8c8"


};

        // Инициализация Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const auth = firebase.auth();

        // Глобальные переменные
        let currentGameId = null;
        let myPlayerId = null;
        let myRole = null;
        let gameData = null;
        let gameListener = null;

        const ROLES = {
            MAFIA: 'Мафия',
            CIVILIAN: 'Мирный житель',
            DOCTOR: 'Доктор',
            DETECTIVE: 'Детектив'
        };

        const ROLE_ICONS = {
            [ROLES.MAFIA]: '🔪',
            [ROLES.CIVILIAN]: '',
            [ROLES.DOCTOR]: '',
            [ROLES.DETECTIVE]: '🔍'
        };

        // ========== АУТЕНТИФИКАЦИЯ И ИГРЫ ==========

        async function createGame() {
            const playerName = document.getElementById('playerNameInput').value.trim();
            if (!playerName) {
                alert('Введите имя!');
                return;
            }

            try {
                // Анонимная авторизация
                const userCredential = await auth.signInAnonymously();
                myPlayerId = userCredential.user.uid;
                console.log('Auth success, UID:', myPlayerId);

                // Создание игры
                const gameCode = generateGameCode();
                currentGameId = gameCode;

                const gameData = {
                    code: gameCode,
                    hostId: myPlayerId,
                    phase: 'waiting',
                    day: 1,
                    players: {
                        [myPlayerId]: {
                            id: myPlayerId,
                            name: playerName,
                            role: null,
                            alive: true,
                            voted: null,
                            isHost: true
                        }
                    },
                    createdAt: firebase.database.ServerValue.TIMESTAMP
                };

                await database.ref(`games/${gameCode}`).set(gameData);
                console.log('Game created:', gameCode);
                
                showWaitingScreen(gameCode);
                setupGameListener(gameCode);
            } catch (error) {
                console.error('Error creating game:', error);
                alert('Ошибка создания игры: ' + error.message);
            }
        }

        async function joinGame() {
            const gameCode = document.getElementById('gameCodeInput').value.trim().toUpperCase();
            const playerName = document.getElementById('joinNameInput').value.trim();

            if (!gameCode || !playerName) {
                alert('Введите код игры и имя!');
                return;
            }

            try {
                const userCredential = await auth.signInAnonymously();
                myPlayerId = userCredential.user.uid;
                console.log('Auth success, UID:', myPlayerId);

                const gameRef = database.ref(`games/${gameCode}`);
                const snapshot = await gameRef.once('value');
                const game = snapshot.val();

                if (!game) {
                    alert('Игра не найдена!');
                    return;
                }

                if (game.phase !== 'waiting') {
                    alert('Игра уже началась!');
                    return;
                }

                if (Object.keys(game.players).length >= 10) {
                    alert('Игра заполнена!');
                    return;
                }

                // Добавление игрока
                await gameRef.child(`players/${myPlayerId}`).set({
                    id: myPlayerId,
                    name: playerName,
                    role: null,
                    alive: true,
                    voted: null,
                    isHost: false
                });

                currentGameId = gameCode;
                showWaitingScreen(gameCode);
                setupGameListener(gameCode);
            } catch (error) {
                console.error('Error joining game:', error);
                alert('Ошибка присоединения: ' + error.message);
            }
        }

        function generateGameCode() {
            return Math.random().toString(36).substring(2, 8).toUpperCase();
        }

        // ========== НАВИГАЦИЯ ==========

        function showMenuScreen() {
            hideAllScreens();
            document.getElementById('menuScreen').classList.remove('hidden');
        }

        function showJoinScreen() {
            hideAllScreens();
            document.getElementById('joinScreen').classList.remove('hidden');
        }

        function showWaitingScreen(gameCode) {
            hideAllScreens();
            document.getElementById('waitingScreen').classList.remove('hidden');
            document.getElementById('displayGameCode').textContent = gameCode;
        }

        function showRoleScreen() {
            hideAllScreens();
            document.getElementById('roleScreen').classList.remove('hidden');
        }

        function showGameScreen() {
            hideAllScreens();
            document.getElementById('gameScreen').classList.remove('hidden');
        }

        function showWinnerScreen() {
            hideAllScreens();
            document.getElementById('winnerScreen').classList.remove('hidden');
        }

        function hideAllScreens() {
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
        }

        // ========== СЛУШАТЕЛЬ ИГРЫ ==========

        function setupGameListener(gameCode) {
            const gameRef = database.ref(`games/${gameCode}`);
            
            gameListener = gameRef.on('value', (snapshot) => {
                const game = snapshot.val();
                if (!game) {
                    console.log('Game data is null');
                    return;
                }

                console.log('Game data updated:', game);
                gameData = game;
                const myPlayer = game.players[myPlayerId];

                if (myPlayer) {
                    myRole = myPlayer.role;
                }

                updateUI(game);
            });
        }

        function updateUI(game) {
            const myPlayer = game.players[myPlayerId];
            if (!myPlayer) {
                console.log('Player not found in game');
                return;
            }

            // Обновление списка игроков на экране ожидания
            if (game.phase === 'waiting') {
                updateWaitingPlayerList(game.players);
            }

            // Показ роли
            if (game.phase === 'role_reveal' && myPlayer.role) {
                showRoleScreen();
                displayRole(myPlayer.role);
            }

            // Игровой процесс
            if (game.phase === 'night' || game.phase === 'day' || game.phase === 'voting') {
                showGameScreen();
                updateGameScreen(game);
            }

            // Конец игры
            if (game.phase === 'finished') {
                showWinnerScreen();
                showFinalResults(game);
            }
        }

        function updateWaitingPlayerList(players) {
            const list = document.getElementById('waitingPlayerList');
            list.innerHTML = Object.values(players).map(p => `
                <div class="player-item ${p.isHost ? 'host' : ''}">
                    <div>
                        <div class="player-name">${p.name} ${p.isHost ? '' : ''}</div>
                        <div class="player-status">${p.id === myPlayerId ? 'Вы' : ''}</div>
                    </div>
                </div>
            `).join('');

            // Показать кнопку начала для хоста
            if (myPlayerId === gameData.hostId) {
                document.getElementById('hostControls').classList.remove('hidden');
            }
        }

        function displayRole(role) {
            document.getElementById('roleIcon').textContent = ROLE_ICONS[role] || '';
            document.getElementById('roleName').textContent = role;
            document.getElementById('roleDescription').textContent = getRoleDescription(role);
        }

        function getRoleDescription(role) {
            const descriptions = {
                [ROLES.MAFIA]: 'Вы - Мафия! Каждую ночь выбирайте жертву вместе с другими мафиями.',
                [ROLES.CIVILIAN]: 'Вы - Мирный житель. Голосуйте днем и ищите мафию!',
                [ROLES.DOCTOR]: 'Вы - Доктор! Каждую ночь спасайте одного игрока от смерти.',
                [ROLES.DETECTIVE]: 'Вы - Детектив! Каждую ночь проверяйте игроков.'
            };
            return descriptions[role] || '';
        }

        function updateGameScreen(game) {
            const myPlayer = game.players[myPlayerId];
            
            // Обновление индикатора фазы
            const phaseEl = document.getElementById('phaseIndicator');
            if (game.phase === 'night') {
                phaseEl.className = 'phase-indicator phase-night';
                phaseEl.textContent = `🌙 Ночь ${game.day}`;
            } else if (game.phase === 'day') {
                phaseEl.className = 'phase-indicator phase-day';
                phaseEl.textContent = `☀️ День ${game.day}`;
            }

            // Обновление списка игроков
            updatePlayersList(game.players);

            // Действия для специальных ролей
            if (game.phase === 'night' && game.activeAction) {
                handleNightAction(game.activeAction, myPlayer);
            }

            // Голосование
            if (game.phase === 'voting') {
                showVotingSection(game);
            }

            // Лог
            if (game.log) {
                updateLog(game.log);
            }
        }

        function updatePlayersList(players) {
            const list = document.getElementById('playersList');
            list.innerHTML = Object.values(players).map(p => `
                <div class="player-item ${p.isHost ? 'host' : ''} ${!p.alive ? 'dead' : ''}">
                    <div>
                        <div class="player-name">${p.name}</div>
                        <div class="player-role">${p.role || '?'}</div>
                    </div>
                    <div class="player-status">${p.alive ? '✅ Жив' : '💀 Мертв'}</div>
                </div>
            `).join('');
        }

        function handleNightAction(action, myPlayer) {
            const panel = document.getElementById('actionPanel');
            const selection = document.getElementById('targetSelection');
            
            panel.classList.remove('hidden');
            
            let title = '';
            let targets = [];

            if (action === 'mafia' && myPlayer.role === ROLES.MAFIA) {
                title = '🔪 Мафия, выберите жертву';
                targets = Object.values(gameData.players).filter(p => p.alive && p.role !== ROLES.MAFIA);
            } else if (action === 'doctor' && myPlayer.role === ROLES.DOCTOR) {
                title = '💉 Доктор, выберите кого спасти';
                targets = Object.values(gameData.players).filter(p => p.alive);
            } else if (action === 'detective' && myPlayer.role === ROLES.DETECTIVE) {
                title = '🔍 Детектив, выберите кого проверить';
                targets = Object.values(gameData.players).filter(p => p.alive && p.role !== ROLES.DETECTIVE);
            } else {
                panel.classList.add('hidden');
                return;
            }

            document.querySelector('#actionPanel h3').textContent = title;
            selection.innerHTML = targets.map(p => `
                <button class="vote-button" onclick="performNightAction('${p.id}')">
                    ${p.name}
                </button>
            `).join('');
        }

        async function performNightAction(targetId) {
            try {
                const gameRef = database.ref(`games/${currentGameId}`);
                
                if (myRole === ROLES.MAFIA) {
                    await gameRef.child('mafiaVote').set(targetId);
                } else if (myRole === ROLES.DOCTOR) {
                    await gameRef.child('doctorVote').set(targetId);
                } else if (myRole === ROLES.DETECTIVE) {
                    await gameRef.child('detectiveVote').set(targetId);
                }
                
                document.getElementById('actionPanel').classList.add('hidden');
                console.log('Night action performed:', targetId);
            } catch (error) {
                console.error('Error performing night action:', error);
                alert('Ошибка: ' + error.message);
            }
        }

        function showVotingSection(game) {
            const section = document.getElementById('voteSection');
            const buttons = document.getElementById('voteButtons');
            const myPlayer = game.players[myPlayerId];

            section.classList.remove('hidden');

            if (myPlayer.voted) {
                buttons.innerHTML = '<div class="waiting-message">✅ Вы уже проголосовали</div>';
                return;
            }

            if (!myPlayer.alive) {
                buttons.innerHTML = '<div class="waiting-message">💀 Вы не можете голосовать</div>';
                return;
            }

            const alivePlayers = Object.values(game.players).filter(p => p.alive);
            
            buttons.innerHTML = alivePlayers.map(p => `
                <button class="vote-button" onclick="castVote('${p.id}')">
                    ${p.name}
                    <span class="vote-count" id="vote-${p.id}">0</span>
                </button>
            `).join('');

            // Обновление счетчиков голосов
            if (game.votes) {
                Object.entries(game.votes).forEach(([playerId, count]) => {
                    const el = document.getElementById(`vote-${playerId}`);
                    if (el) el.textContent = count;
                });
            }
        }

        async function castVote(targetId) {
            try {
                if (gameData.players[myPlayerId].voted) return;

                const gameRef = database.ref(`games/${currentGameId}`);
                await gameRef.child(`players/${myPlayerId}/voted`).set(targetId);
                await gameRef.child(`votes/${targetId}`).transaction(count => (count || 0) + 1);
                console.log('Vote cast for:', targetId);
            } catch (error) {
                console.error('Error casting vote:', error);
                alert('Ошибка голосования: ' + error.message);
            }
        }

        function updateLog(log) {
            const logEl = document.getElementById('gameLog');
            logEl.innerHTML = log.map(entry => `
                <div class="log-entry">${entry}</div>
            `).join('');
            logEl.scrollTop = logEl.scrollHeight;
        }

        function showFinalResults(game) {
            const container = document.getElementById('finalRoles');
            const winnerTitle = document.getElementById('winnerTitle');
            
            const mafiaCount = Object.values(game.players).filter(p => p.role === ROLES.MAFIA && p.alive).length;
            const winner = mafiaCount === 0 ? 'Мирные жители победили! 🎉' : 'Мафия победила! 🔪';
            
            winnerTitle.textContent = winner;
            
            container.innerHTML = Object.values(game.players).map(p => `
                <div class="player-item">
                    <div>
                        <div class="player-name">${p.name}</div>
                        <div class="player-role">${ROLE_ICONS[p.role] || ''} ${p.role}</div>
                    </div>
                    <div class="player-status">${p.alive ? '✅' : '💀'}</div>
                </div>
            `).join('');
        }

        // ========== УПРАВЛЕНИЕ ИГРОЙ (ХОСТ) ==========

        async function startGame() {
            console.log('startGame called');
            console.log('myPlayerId:', myPlayerId);
            console.log('gameData:', gameData);
            console.log('gameData.hostId:', gameData?.hostId);

            if (!gameData) {
                alert('Данные игры не загружены!');
                return;
            }

            if (myPlayerId !== gameData.hostId) {
                alert('Только хост может начать игру!');
                return;
            }

            const playerCount = Object.keys(gameData.players).length;
            console.log('Player count:', playerCount);

            if (playerCount < 4) {
                alert('Нужно минимум 4 игрока!');
                return;
            }

            try {
                const gameRef = database.ref(`games/${currentGameId}`);
                
                // Раздача ролей
                const roles = distributeRoles(playerCount);
                const players = Object.keys(gameData.players);
                
                console.log('Distributing roles:', roles);
                
                const updates = {
                    phase: 'role_reveal',
                    players: {}
                };

                players.forEach((playerId, index) => {
                    updates.players[`${playerId}/role`] = roles[index];
                });

                console.log('Updates:', updates);
                await gameRef.update(updates);
                console.log('Game phase updated to role_reveal');

                // Через 15 секунд начинаем первую ночь
                setTimeout(async () => {
                    try {
                        await gameRef.update({
                            phase: 'night',
                            day: 1,
                            activeAction: 'mafia',
                            log: ['=== Ночь 1 ===', 'Мафия просыпается']
                        });
                        console.log('Game started: night phase');
                    } catch (error) {
                        console.error('Error starting night:', error);
                    }
                }, 15000);
            } catch (error) {
                console.error('Error starting game:', error);
                alert('Ошибка начала игры: ' + error.message);
            }
        }

        function distributeRoles(playerCount) {
            const mafiaCount = Math.max(1, Math.floor(playerCount / 3));
            const roles = [];

            roles.push(ROLES.DOCTOR);
            roles.push(ROLES.DETECTIVE);

            for (let i = 0; i < mafiaCount; i++) {
                roles.push(ROLES.MAFIA);
            }

            while (roles.length < playerCount) {
                roles.push(ROLES.CIVILIAN);
            }

            return roles.sort(() => Math.random() - 0.5);
        }

        // Очистка при выходе
        window.addEventListener('beforeunload', () => {
            if (gameListener && currentGameId) {
                database.ref(`games/${currentGameId}`).off('value', gameListener);
            }
        });

        // Debug: показать информацию на экране
        setInterval(() => {
            const debugEl = document.getElementById('debugInfo');
            if (debugEl && gameData) {
                debugEl.textContent = `Phase: ${gameData.phase}, Players: ${Object.keys(gameData.players).length}, Host: ${gameData.hostId === myPlayerId}`;
                debugEl.classList.remove('hidden');
            }
        }, 2000);
    </script>
</body>
</html>
