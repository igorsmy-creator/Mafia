<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мафия Онлайн</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 {
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 30px;
            background: linear-gradient(45deg, #ff6b6b, #ffd93d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .screen {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        .hidden { display: none !important; }
        input[type="text"], input[type="checkbox"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #ffd93d;
            border-radius: 8px;
            background: rgba(0,0,0,0.3);
            color: #eee;
            font-size: 1.1em;
            margin-bottom: 15px;
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            margin: 10px 0;
        }
        .checkbox-label input { width: auto; margin: 0; }
        button {
            background: linear-gradient(45deg, #ff6b6b, #ee5a6f);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1em;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin: 10px 0;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255,107,107,0.4); }
        .btn-secondary { background: linear-gradient(45deg, #4ecdc4, #44a3aa); }
        .btn-small { padding: 10px 15px; font-size: 0.9em; width: auto; margin: 5px; }
        .game-code {
            text-align: center;
            font-size: 3em;
            font-weight: bold;
            color: #ffd93d;
            background: rgba(0,0,0,0.4);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            letter-spacing: 5px;
            border: 3px solid #ffd93d;
        }
        .player-item {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            border-left: 4px solid #4ecdc4;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .player-item.host { border-left-color: #ffd93d; }
        .player-item.dead { opacity: 0.7; border-left-color: #ff6b6b; }
        .player-name { font-size: 1.2em; font-weight: bold; }
        .player-role { color: #ffd93d; font-size: 0.9em; }
        .player-status { font-size: 0.9em; color: #4ecdc4; }
        .phase-indicator {
            text-align: center;
            font-size: 2em;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            font-weight: bold;
        }
        .phase-night { background: linear-gradient(45deg, #2c3e50, #34495e); color: #ffd93d; }
        .phase-day { background: linear-gradient(45deg, #ffd93d, #ff9a3c); color: #1a1a2e; }
        .role-card {
            background: linear-gradient(135deg, rgba(255,107,107,0.2), rgba(255,217,61,0.2));
            border: 3px solid #ffd93d;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            margin: 30px 0;
        }
        .role-icon { font-size: 4em; margin-bottom: 20px; }
        .role-name { font-size: 2em; font-weight: bold; margin-bottom: 10px; }
        .role-description { font-size: 1.1em; color: #4ecdc4; }
        .my-role-badge {
            text-align: center;
            background: rgba(255,217,61,0.15);
            border: 1px solid #ffd93d;
            color: #ffd93d;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 1.2em;
            font-weight: bold;
        }
        .vote-section { background: rgba(255,107,107,0.1); padding: 20px; border-radius: 10px; margin: 20px 0; }
        .vote-button {
            background: rgba(78,205,196,0.2);
            border: 2px solid #4ecdc4;
            padding: 15px;
            margin: 5px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1em;
            width: 100%;
            color: #eee;
        }
        .vote-button:hover:not(:disabled) { background: rgba(78,205,196,0.4); }
        .vote-button:disabled { opacity: 0.4; cursor: not-allowed; }
        .vote-count { display: inline-block; background: #ff6b6b; padding: 5px 10px; border-radius: 5px; margin-left: 10px; }
        .log {
            background: rgba(0,0,0,0.5);
            padding: 15px;
            border-radius: 10px;
            max-height: 200px;
            overflow-y: auto;
            margin: 20px 0;
        }
        .log-entry { padding: 8px; margin: 5px 0; border-left: 3px solid #ffd93d; background: rgba(255,217,61,0.1); }
        .waiting-message { text-align: center; font-size: 1.3em; color: #4ecdc4; padding: 20px; font-style: italic; }
        .action-panel { background: rgba(0,0,0,0.5); padding: 30px; border-radius: 15px; margin: 20px 0; text-align: center; }
        .action-title { font-size: 2em; margin-bottom: 20px; color: #ffd93d; }
        .target-selection { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin: 20px 0; }
        .detective-result { font-size: 1.8em; padding: 20px; border-radius: 10px; margin: 10px 0; font-weight: bold; }
        .result-mafia { background: rgba(255,107,107,0.3); color: #ff6b6b; border: 2px solid #ff6b6b; }
        .result-civilian { background: rgba(78,205,196,0.3); color: #4ecdc4; border: 2px solid #4ecdc4; }
        .settings-panel { background: rgba(255,217,61,0.1); border: 1px solid #ffd93d; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        .settings-panel h3 { color: #ffd93d; margin-bottom: 10px; }
        .in-game-settings { position: fixed; top: 10px; right: 10px; z-index: 1000; }
        .settings-dropdown {
            position: absolute;
            right: 0;
            top: 40px;
            background: rgba(0,0,0,0.9);
            border: 2px solid #ffd93d;
            border-radius: 10px;
            padding: 15px;
            min-width: 250px;
            display: none;
        }
        .settings-dropdown.show { display: block; }
        .detective-timer-bar {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
            margin-top: 15px;
            overflow: hidden;
        }
        .detective-timer-fill {
            height: 100%;
            background: linear-gradient(90deg, #4ecdc4, #ffd93d);
            transition: width 0.1s linear;
        }
        .final-role-item {
            background: rgba(0,0,0,0.3);
            padding: 12px 15px;
            margin: 8px 0;
            border-radius: 8px;
            border-left: 4px solid #4ecdc4;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .final-role-item.mafia { border-left-color: #ff6b6b; background: rgba(255,107,107,0.1); }
        .final-role-item.doctor { border-left-color: #4ecdc4; }
        .final-role-item.detective { border-left-color: #ffd93d; }
    </style>
</head>
<body>
    <div class="container">
        <h1> МАФИЯ ОНЛАЙН </h1>
        
        <div id="menuScreen" class="screen">
            <h2 style="text-align: center; margin-bottom: 20px;">Добро пожаловать!</h2>
            <div class="settings-panel">
                <h3>⚙️ Настройки</h3>
                <label class="checkbox-label">
                    <input type="checkbox" id="voiceEnabled" checked>
                    <span>🔊 Голосовое сопровождение</span>
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="soundEnabled" checked>
                    <span>🔔 Звуковые эффекты</span>
                </label>
            </div>
            <input type="text" id="playerNameInput" placeholder="Введите ваше имя">
            <button onclick="createGame()">🎮 Создать игру</button>
            <button class="btn-secondary" onclick="showJoinScreen()">🔗 Присоединиться к игре</button>
        </div>

        <div id="joinScreen" class="screen hidden">
            <h2 style="text-align: center; margin-bottom: 20px;">Присоединение к игре</h2>
            <input type="text" id="gameCodeInput" placeholder="Код игры">
            <input type="text" id="joinNameInput" placeholder="Ваше имя">
            <button onclick="joinGame()">Присоединиться</button>
            <button class="btn-secondary" onclick="showMenuScreen()">← Назад</button>
        </div>

        <div id="waitingScreen" class="screen hidden">
            <h2 style="text-align: center;">Ожидание игроков</h2>
            <div class="game-code" id="displayGameCode">----</div>
            <p style="text-align: center; margin: 20px 0;">Поделитесь этим кодом с друзьями</p>
            <div id="waitingPlayerList"></div>
            <div id="hostControls" class="hidden">
                <button id="startGameBtn" onclick="startGame()">🎲 Начать игру</button>
            </div>
            <div class="waiting-message">Ожидание других игроков...</div>
        </div>

        <div id="roleScreen" class="screen hidden">
            <div class="role-card">
                <div class="role-icon" id="roleIcon"></div>
                <div class="role-name" id="roleName">Ваша роль</div>
                <div class="role-description" id="roleDescription">Описание роли</div>
            </div>
            <div class="waiting-message">Запомните роль. Игра начнется автоматически...</div>
        </div>

        <div id="gameScreen" class="screen hidden">
            <div class="in-game-settings">
                <button class="btn-small" onclick="toggleSettings()">⚙️ Настройки</button>
                <div id="settingsDropdown" class="settings-dropdown">
                    <h3 style="color: #ffd93d; margin-bottom: 10px;">🔊 Звук</h3>
                    <label class="checkbox-label">
                        <input type="checkbox" id="gameVoiceEnabled" checked onchange="updateSoundSettings()">
                        <span>Голосовое сопровождение</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="gameSoundEnabled" checked onchange="updateSoundSettings()">
                        <span>Звуковые эффекты</span>
                    </label>
                </div>
            </div>
            
            <div id="myRoleBadge" class="my-role-badge"></div>
            <div id="phaseIndicator" class="phase-indicator"></div>
            <div id="actionPanel" class="action-panel hidden">
                <div class="action-title" id="actionTitle">Выберите действие</div>
                <div id="targetSelection" class="target-selection"></div>
            </div>
            <div id="voteSection" class="vote-section hidden">
                <h3 style="text-align: center; margin-bottom: 15px;">🗳️ Голосование</h3>
                <div id="voteButtons"></div>
                <button id="endVotingBtn" onclick="endVoting()" style="margin-top: 15px;" class="hidden">Завершить голосование (только хост)</button>
            </div>
            <div id="playersList"></div>
            <div id="gameLog" class="log"></div>
        </div>

        <div id="winnerScreen" class="screen hidden">
            <h1 id="winnerTitle" style="text-align: center; margin-bottom: 30px;"></h1>
            <div id="finalRoles"></div>
            <button onclick="location.reload()">🔄 Новая игра</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD80aEmTGwNjW7x6YLxqB5QyjfMA8vs2D4",
            authDomain: "mafia-game-7f26e.firebaseapp.com",
            databaseURL: "https://mafia-game-7f26e-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "mafia-game-7f26e",
            storageBucket: "mafia-game-7f26e.firebasestorage.app",
            messagingSenderId: "182626561753",
            appId: "1:182626561753:web:a25db8e9fbe5b940bfd8c8"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const auth = firebase.auth();

        let currentGameId = null;
        let myPlayerId = null;
        let myRole = null;
        let gameData = null;
        let gameListener = null;
        let lastProcessedActionTime = 0;
        let lastProcessedPhase = '';
        let voiceEnabled = true;
        let soundEnabled = true;
        let audioContext = null;
        let audioInitialized = false;
        let votingTimer = null;
        let detectiveResultTimer = null;
        let detectiveResultStartTime = 0;
        let roleTimeoutTimer = null;
        let hasVotedThisRound = false; // Локальный флаг голосования

        const ROLES = { MAFIA: 'Мафия', CIVILIAN: 'Мирный житель', DOCTOR: 'Доктор', DETECTIVE: 'Детектив' };
        const ROLE_ICONS = { 'Мафия': '', 'Мирный житель': '👤', 'Доктор': '💉', 'Детектив': '🔍' };

        function initAudio() {
            if (audioInitialized) return;
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                audioInitialized = true;
            } catch(e) { console.error('Audio init failed:', e); }
        }

        function playSound(type) {
            if (!soundEnabled || !audioContext) return;
            try {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                switch(type) {
                    case 'night':
                        oscillator.frequency.setValueAtTime(200, audioContext.currentTime);
                        oscillator.frequency.exponentialRampToValueAtTime(100, audioContext.currentTime + 1);
                        gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 1);
                        oscillator.start(audioContext.currentTime);
                        oscillator.stop(audioContext.currentTime + 1);
                        break;
                    case 'day':
                        oscillator.frequency.setValueAtTime(400, audioContext.currentTime);
                        oscillator.frequency.exponentialRampToValueAtTime(600, audioContext.currentTime + 0.5);
                        gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                        oscillator.start(audioContext.currentTime);
                        oscillator.stop(audioContext.currentTime + 0.5);
                        break;
                    case 'wake':
                        oscillator.frequency.setValueAtTime(300, audioContext.currentTime);
                        oscillator.frequency.exponentialRampToValueAtTime(500, audioContext.currentTime + 0.3);
                        gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                        oscillator.start(audioContext.currentTime);
                        oscillator.stop(audioContext.currentTime + 0.3);
                        break;
                    case 'action':
                        oscillator.frequency.setValueAtTime(600, audioContext.currentTime);
                        gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                        oscillator.start(audioContext.currentTime);
                        oscillator.stop(audioContext.currentTime + 0.1);
                        break;
                }
            } catch(e) { console.error('Sound play failed:', e); }
        }

        function speak(text) {
            if (!voiceEnabled || !window.speechSynthesis) return;
            try {
                speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ru-RU';
                utterance.rate = 0.9;
                utterance.pitch = 1;
                speechSynthesis.speak(utterance);
            } catch(e) { console.error('Speech failed:', e); }
        }

        function toggleSettings() {
            document.getElementById('settingsDropdown').classList.toggle('show');
        }

        function updateSoundSettings() {
            voiceEnabled = document.getElementById('gameVoiceEnabled').checked;
            soundEnabled = document.getElementById('gameSoundEnabled').checked;
            const menuVoice = document.getElementById('voiceEnabled');
            const menuSound = document.getElementById('soundEnabled');
            if (menuVoice) menuVoice.checked = voiceEnabled;
            if (menuSound) menuSound.checked = soundEnabled;
        }

        function showMenuScreen() { 
            hideAllScreens(); 
            document.getElementById('menuScreen').classList.remove('hidden'); 
            document.getElementById('settingsDropdown')?.classList.remove('show');
        }
        function showJoinScreen() { hideAllScreens(); document.getElementById('joinScreen').classList.remove('hidden'); }
        function showWaitingScreen(gameCode) { 
            hideAllScreens(); 
            document.getElementById('waitingScreen').classList.remove('hidden'); 
            document.getElementById('displayGameCode').textContent = gameCode; 
        }
        function showRoleScreen() { hideAllScreens(); document.getElementById('roleScreen').classList.remove('hidden'); }
        function showGameScreen() { 
            hideAllScreens(); 
            document.getElementById('gameScreen').classList.remove('hidden');
            document.getElementById('gameVoiceEnabled').checked = voiceEnabled;
            document.getElementById('gameSoundEnabled').checked = soundEnabled;
        }
        function showWinnerScreen() { hideAllScreens(); document.getElementById('winnerScreen').classList.remove('hidden'); }
        function hideAllScreens() { document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden')); }

        async function createGame() {
            const playerName = document.getElementById('playerNameInput').value.trim();
            if (!playerName) { alert('Введите имя!'); return; }
            
            voiceEnabled = document.getElementById('voiceEnabled').checked;
            soundEnabled = document.getElementById('soundEnabled').checked;
            initAudio();
            
            try {
                const cred = await auth.signInAnonymously();
                myPlayerId = cred.user.uid;
                const gameCode = Math.random().toString(36).substring(2, 8).toUpperCase();
                currentGameId = gameCode;

                await database.ref(`games/${gameCode}`).set({
                    code: gameCode, hostId: myPlayerId, phase: 'waiting', day: 1,
                    players: { [myPlayerId]: { id: myPlayerId, name: playerName, role: null, alive: true, voted: null, isHost: true } },
                    createdAt: firebase.database.ServerValue.TIMESTAMP
                });
                showWaitingScreen(gameCode);
                setupGameListener(gameCode);
            } catch (e) { alert('Ошибка: ' + e.message); }
        }

        async function joinGame() {
            const gameCode = document.getElementById('gameCodeInput').value.trim().toUpperCase();
            const playerName = document.getElementById('joinNameInput').value.trim();
            if (!gameCode || !playerName) { alert('Введите код и имя!'); return; }
            
            voiceEnabled = document.getElementById('voiceEnabled').checked;
            soundEnabled = document.getElementById('soundEnabled').checked;
            initAudio();
            
            try {
                const cred = await auth.signInAnonymously();
                myPlayerId = cred.user.uid;
                const snap = await database.ref(`games/${gameCode}`).once('value');
                const game = snap.val();
                if (!game) { alert('Игра не найдена!'); return; }
                if (game.phase !== 'waiting') { alert('Игра уже началась!'); return; }
                if (Object.keys(game.players).length >= 10) { alert('Игра заполнена!'); return; }

                await database.ref(`games/${gameCode}/players/${myPlayerId}`).set({
                    id: myPlayerId, name: playerName, role: null, alive: true, voted: null, isHost: false
                });
                currentGameId = gameCode;
                showWaitingScreen(gameCode);
                setupGameListener(gameCode);
            } catch (e) { alert('Ошибка: ' + e.message); }
        }

        function setupGameListener(gameCode) {
            gameListener = database.ref(`games/${gameCode}`).on('value', (snap) => {
                const game = snap.val();
                if (!game) return;
                gameData = game;
                const myPlayer = game.players[myPlayerId];
                if (myPlayer && myPlayer.role) myRole = myPlayer.role;
                
                // Сброс локального флага голосования при смене фазы на voting
                if (game.phase === 'voting' && myPlayer.voted === null) {
                    hasVotedThisRound = false;
                }
                
                updateUI(game);
            });
        }

        function updateUI(game) {
            const myPlayer = game.players[myPlayerId];
            if (!myPlayer) return;

            if (game.phase === 'waiting') {
                updateWaitingList(game.players);
            } else if (game.phase === 'role_reveal') {
                if (myPlayer.role) {
                    showRoleScreen();
                    document.getElementById('roleIcon').textContent = ROLE_ICONS[myPlayer.role] || '🎭';
                    document.getElementById('roleName').textContent = myPlayer.role;
                    document.getElementById('roleDescription').textContent = getRoleDesc(myPlayer.role);
                }
            } else if (game.phase === 'night' || game.phase === 'day' || game.phase === 'voting') {
                showGameScreen();
                updateGameScreen(game);
            } else if (game.phase === 'finished') {
                showWinnerScreen();
                showFinalResults(game);
            }

            const currentPhaseKey = `${game.phase}-${game.activeAction || 'none'}`;
            const detectiveStillViewing = game.activeAction === 'detective' && 
                                          game.detectiveActionDone && 
                                          !game.detectiveResultSeen;
            
            if (myPlayerId === game.hostId && game.lastActionAt && game.lastActionAt > lastProcessedActionTime && 
                currentPhaseKey !== lastProcessedPhase && !detectiveStillViewing) {
                lastProcessedActionTime = game.lastActionAt;
                lastProcessedPhase = currentPhaseKey;
                setTimeout(() => advanceNightPhaseHost(), 3000);
            }
            
            if (myPlayerId === game.hostId && game.phase === 'day' && game.dayStartedAt && !votingTimer) {
                const timeSinceDayStart = Date.now() - game.dayStartedAt;
                const remainingTime = Math.max(0, 8000 - timeSinceDayStart);
                votingTimer = setTimeout(() => {
                    startVotingPhase();
                }, remainingTime);
            }
        }

        function updateWaitingList(players) {
            document.getElementById('waitingPlayerList').innerHTML = Object.values(players).map(p => `
                <div class="player-item ${p.isHost ? 'host' : ''}">
                    <div><div class="player-name">${p.name}</div><div class="player-status">${p.id === myPlayerId ? 'Вы' : ''}</div></div>
                </div>
            `).join('');
            if (myPlayerId === gameData.hostId) document.getElementById('hostControls').classList.remove('hidden');
        }

        function getRoleDesc(role) {
            return {
                'Мафия': 'Вы - Мафия! Каждую ночь выбирайте жертву.',
                'Мирный житель': 'Вы - Мирный житель. Ищите мафию!',
                'Доктор': 'Вы - Доктор! Спасайте игроков ночью.',
                'Детектив': 'Вы - Детектив! Проверяйте игроков ночью.'
            }[role] || '';
        }

        function updateGameScreen(game) {
            document.getElementById('myRoleBadge').innerHTML = `Ваша роль: ${ROLE_ICONS[myRole] || '🎭'} ${myRole || 'Неизвестно'}`;

            const phaseEl = document.getElementById('phaseIndicator');
            if (game.phase === 'night') {
                phaseEl.className = 'phase-indicator phase-night';
                phaseEl.textContent = ` Ночь ${game.day}`;
            } else if (game.phase === 'day') {
                phaseEl.className = 'phase-indicator phase-day';
                phaseEl.textContent = `☀️ День ${game.day}`;
            } else if (game.phase === 'voting') {
                phaseEl.className = 'phase-indicator phase-day';
                phaseEl.textContent = `🗳️ Голосование - День ${game.day}`;
            }

            renderPlayerList(game);

            // ИСПРАВЛЕНИЕ: Не скрываем панель если детектив смотрит результат
            const detectiveViewingResult = game.phase === 'night' && 
                                           game.activeAction === 'detective' && 
                                           game.detectiveActionDone && 
                                           !game.detectiveResultSeen;
            
            if (game.phase === 'night' && game.activeAction) {
                handleNightAction(game.activeAction, game.players[myPlayerId]);
            } else if (!detectiveViewingResult) {
                document.getElementById('actionPanel').classList.add('hidden');
            }

            if (game.phase === 'voting') {
                showVotingSection(game);
            } else {
                document.getElementById('voteSection').classList.add('hidden');
            }

            if (game.log) {
                const logEl = document.getElementById('gameLog');
                const logArray = Array.isArray(game.log) ? game.log : [game.log];
                logEl.innerHTML = logArray.map(e => `<div class="log-entry">${e}</div>`).join('');
                logEl.scrollTop = logEl.scrollHeight;
            }
        }

        function renderPlayerList(game) {
            const listEl = document.getElementById('playersList');
            const isNight = game.phase === 'night';
            const isFinished = game.phase === 'finished';

            let html = '';
            Object.values(game.players).forEach(p => {
                if (!p.alive) {
                    html += `
                        <div class="player-item dead">
                            <div>
                                <div class="player-name">${p.name}</div>
                                <div class="player-role" style="color: #ff6b6b;">💀 Мертв</div>
                            </div>
                            <div class="player-status" style="color: #ff6b6b;">💀</div>
                        </div>
                    `;
                } else if (isNight) {
                    html += `
                        <div class="player-item">
                            <div class="player-name">${p.name}</div>
                            <div class="player-role" style="color: #888; font-style: italic;"> Спит</div>
                        </div>
                    `;
                } else {
                    const isMe = p.id === myPlayerId;
                    let roleDisplay = '?';
                    if (isFinished || isMe) {
                        roleDisplay = p.role || '?';
                    }
                    html += `
                        <div class="player-item">
                            <div>
                                <div class="player-name">${p.name} ${isMe ? '(Вы)' : ''}</div>
                                <div class="player-role">${ROLE_ICONS[roleDisplay] || ''} ${roleDisplay}</div>
                            </div>
                            <div class="player-status">✅ Жив</div>
                        </div>
                    `;
                }
            });
            listEl.innerHTML = html;
        }

        function handleNightAction(action, myPlayer) {
            const panel = document.getElementById('actionPanel');
            const sel = document.getElementById('targetSelection');
            const title = document.getElementById('actionTitle');

            const currentRole = myRole || myPlayer.role;
            let targets = [];

            if (action === 'mafia' && currentRole === 'Мафия') {
                title.textContent = '🔪 Мафия, выберите жертву';
                targets = Object.values(gameData.players).filter(p => p.alive && p.role !== 'Мафия');
                startRoleTimeout('mafia', 30000);
            } else if (action === 'doctor' && currentRole === 'Доктор') {
                title.textContent = '💉 Доктор, выберите кого спасти';
                targets = Object.values(gameData.players).filter(p => p.alive);
                startRoleTimeout('doctor', 30000);
            } else if (action === 'detective' && currentRole === 'Детектив') {
                const detectiveActionDone = gameData.detectiveActionDone;
                const detectiveResultSeen = gameData.detectiveResultSeen;
                
                if (detectiveActionDone && !detectiveResultSeen) {
                    const target = Object.values(gameData.players).find(p => p.id === gameData.detectiveVote);
                    if (target) {
                        const isMafia = target.role === 'Мафия';
                        panel.classList.remove('hidden');
                        title.textContent = '🔍 Результат проверки';
                        sel.innerHTML = `
                            <div class="detective-result ${isMafia ? 'result-mafia' : 'result-civilian'}">
                                ${target.name}: ${isMafia ? ' МАФИЯ!' : '✅ Мирный житель'}
                            </div>
                            <div class="waiting-message" id="detectiveTimerText">Запомните результат...</div>
                            <div class="detective-timer-bar">
                                <div class="detective-timer-fill" id="detectiveTimerFill" style="width: 100%"></div>
                            </div>
                        `;
                        
                        // ИСПРАВЛЕНИЕ: Запускаем таймер гарантированно, очищая предыдущий
                        if (detectiveResultTimer) {
                            clearInterval(detectiveResultTimer);
                        }
                        
                        detectiveResultStartTime = Date.now();
                        const DURATION = 5000; // 5 секунд
                        
                        // Анимация прогресс-бара
                        detectiveResultTimer = setInterval(() => {
                            const elapsed = Date.now() - detectiveResultStartTime;
                            const remaining = Math.max(0, DURATION - elapsed);
                            const percent = (remaining / DURATION) * 100;
                            
                            const fill = document.getElementById('detectiveTimerFill');
                            const text = document.getElementById('detectiveTimerText');
                            
                            if (fill) fill.style.width = percent + '%';
                            if (text) text.textContent = `Запомните результат... ${Math.ceil(remaining / 1000)} сек`;
                            
                            if (remaining <= 0) {
                                clearInterval(detectiveResultTimer);
                                detectiveResultTimer = null;
                                
                                const ref = database.ref(`games/${currentGameId}`);
                                ref.update({ 
                                    detectiveResultSeen: true,
                                    lastActionAt: firebase.database.ServerValue.TIMESTAMP 
                                });
                            }
                        }, 100);
                    }
                    return;
                }
                
                if (detectiveActionDone && detectiveResultSeen) {
                    panel.classList.add('hidden');
                    return;
                }
                
                title.textContent = '🔍 Детектив, выберите кого проверить';
                targets = Object.values(gameData.players).filter(p => p.alive && p.role !== 'Детектив');
                startRoleTimeout('detective', 30000);
            } else {
                panel.classList.add('hidden');
                return;
            }

            panel.classList.remove('hidden');
            sel.innerHTML = targets.map(p => `
                <button class="vote-button" onclick="performNightAction('${p.id}')">${p.name}</button>
            `).join('');
        }

        function startRoleTimeout(role, timeout) {
            if (roleTimeoutTimer) clearTimeout(roleTimeoutTimer);
            roleTimeoutTimer = setTimeout(async () => {
                const ref = database.ref(`games/${currentGameId}`);
                const currentAction = gameData.activeAction;
                if (currentAction === role) {
                    await ref.update({ 
                        lastActionAt: firebase.database.ServerValue.TIMESTAMP,
                        [`${role}Vote`]: null
                    });
                }
            }, timeout);
        }

        async function performNightAction(targetId) {
            try {
                initAudio();
                const ref = database.ref(`games/${currentGameId}`);
                const actionKey = myRole === 'Мафия' ? 'mafiaVote' : (myRole === 'Доктор' ? 'doctorVote' : 'detectiveVote');
                
                playSound('action');
                
                const updates = {
                    [actionKey]: targetId,
                    lastActionAt: firebase.database.ServerValue.TIMESTAMP
                };
                
                if (myRole === 'Детектив') {
                    updates.detectiveActionDone = true;
                    updates.detectiveResultSeen = false;
                }
                
                await ref.update(updates);
                
                if (roleTimeoutTimer) {
                    clearTimeout(roleTimeoutTimer);
                    roleTimeoutTimer = null;
                }
                
                document.getElementById('actionPanel').classList.add('hidden');
            } catch (e) { alert('Ошибка: ' + e.message); }
        }

        async function advanceNightPhaseHost() {
            const ref = database.ref(`games/${currentGameId}`);
            const currentAction = gameData.activeAction;
            
            const snap = await ref.once('value');
            const latestGame = snap.val();
            const currentLog = Array.isArray(latestGame.log) ? latestGame.log : (latestGame.log ? [latestGame.log] : []);

            if (currentAction === 'mafia') {
                const hasDoctor = Object.values(latestGame.players).some(p => p.role === 'Доктор' && p.alive);
                if (hasDoctor) {
                    playSound('wake');
                    speak('Просыпается доктор');
                    await ref.update({ activeAction: 'doctor', log: [...currentLog, '💉 Доктор просыпается'] });
                } else {
                    await advanceToDetectiveOrDay(ref, latestGame);
                }
            } else if (currentAction === 'doctor') {
                await advanceToDetectiveOrDay(ref, latestGame);
            } else if (currentAction === 'detective') {
                playSound('day');
                speak('Ночь закончилась. Наступает день');
                await ref.update({ 
                    activeAction: null, 
                    phase: 'day',
                    dayStartedAt: Date.now(),
                    log: [...currentLog, '☀️ Ночь закончилась. Город просыпается.'] 
                });
            }
        }

        async function advanceToDetectiveOrDay(ref, latestGame) {
            const currentLog = Array.isArray(latestGame.log) ? latestGame.log : (latestGame.log ? [latestGame.log] : []);
            const hasDetective = Object.values(latestGame.players).some(p => p.role === 'Детектив' && p.alive);
            
            if (hasDetective) {
                playSound('wake');
                speak('Просыпается детектив');
                await ref.update({ activeAction: 'detective', log: [...currentLog, ' Детектив просыпается'] });
            } else {
                playSound('day');
                speak('Ночь закончилась. Наступает день');
                await ref.update({ 
                    activeAction: null, 
                    phase: 'day',
                    dayStartedAt: Date.now(),
                    log: [...currentLog, '☀️ Ночь закончилась. Город просыпается.'] 
                });
            }
        }

        async function startVotingPhase() {
            if (votingTimer) {
                clearTimeout(votingTimer);
                votingTimer = null;
            }
            
            const ref = database.ref(`games/${currentGameId}`);
            const currentLog = Array.isArray(gameData.log) ? gameData.log : [gameData.log];
            
            const newLog = [...currentLog];
            let victimName = null;
            let wasSaved = false;
            
            if (gameData.mafiaVote) {
                const victim = Object.values(gameData.players).find(p => p.id === gameData.mafiaVote);
                if (victim && victim.alive) {
                    if (gameData.doctorVote === gameData.mafiaVote) {
                        wasSaved = true;
                        newLog.push('💉 Доктор спас жертву мафии!');
                    } else {
                        await ref.child(`players/${victim.id}/alive`).set(false);
                        victimName = victim.name;
                        newLog.push(`💀 ${victim.name} был убит ночью`);
                    }
                }
            }
            
            playSound('day');
            
            // ИСПРАВЛЕНИЕ: Озвучка результатов ночи
            if (victimName) {
                speak(`Утром обнаружено тело. ${victimName} не проснулся.`);
            } else if (wasSaved) {
                speak('Ночь прошла спокойно. Доктор спас жертву.');
            } else {
                speak('Ночь прошла спокойно. Все живы.');
            }
            
            await ref.update({
                phase: 'voting',
                votes: {},
                log: newLog
            });
            
            for (const playerId in gameData.players) {
                await ref.child(`players/${playerId}/voted`).set(null);
            }
            
            // Сброс локального флага
            hasVotedThisRound = false;
        }

        function showVotingSection(game) {
            const section = document.getElementById('voteSection');
            const buttons = document.getElementById('voteButtons');
            const myPlayer = game.players[myPlayerId];
            section.classList.remove('hidden');

            const endBtn = document.getElementById('endVotingBtn');
            if (myPlayerId === game.hostId) {
                endBtn.classList.remove('hidden');
            } else {
                endBtn.classList.add('hidden');
            }

            if (!myPlayer.alive) {
                buttons.innerHTML = '<div class="waiting-message">💀 Вы не можете голосовать</div>';
                return;
            }

            // ИСПРАВЛЕНИЕ: Используем локальный флаг + проверку из Firebase
            const hasVoted = hasVotedThisRound || (myPlayer.voted !== null && myPlayer.voted !== undefined);
            
            if (hasVoted) {
                const votedFor = Object.values(game.players).find(p => p.id === myPlayer.voted);
                buttons.innerHTML = `
                    <div class="waiting-message">
                        ✅ Вы уже проголосовали за <strong>${votedFor ? votedFor.name : 'неизвестного'}</strong><br>
                        Ожидание остальных игроков...
                    </div>
                `;
                return;
            }

            const alive = Object.values(game.players).filter(p => p.alive);
            buttons.innerHTML = alive.map(p => `
                <button class="vote-button" onclick="castVote('${p.id}')">
                    ${p.name}
                    <span class="vote-count">${(game.votes && game.votes[p.id]) || 0}</span>
                </button>
            `).join('');
        }

        async function castVote(targetId) {
            try {
                // ИСПРАВЛЕНИЕ: Двойная проверка - локальный флаг + транзакция Firebase
                if (hasVotedThisRound) {
                    alert('Вы уже проголосовали в этом раунде!');
                    return;
                }
                
                const ref = database.ref(`games/${currentGameId}`);
                
                // Атомарная проверка через транзакцию
                const voteResult = await ref.child(`players/${myPlayerId}/voted`).transaction(current => {
                    if (current !== null && current !== undefined) {
                        return; // уже голосовал - отменяем
                    }
                    return targetId;
                });
                
                if (!voteResult.committed) {
                    alert('Вы уже проголосовали! Голос не принят.');
                    return;
                }
                
                // Голос засчитан - увеличиваем счётчик
                await ref.child(`votes/${targetId}`).transaction(c => (c || 0) + 1);
                
                // Устанавливаем локальный флаг
                hasVotedThisRound = true;
                
                playSound('action');
            } catch (e) { 
                console.error('Vote error:', e);
                alert('Ошибка голосования: ' + e.message); 
            }
        }

        async function endVoting() {
            if (gameData.phase !== 'voting') return;
            if (myPlayerId !== gameData.hostId) {
                alert('Только хост может завершить голосование!');
                return;
            }
            
            const ref = database.ref(`games/${currentGameId}`);
            let maxVotes = 0;
            let eliminatedPlayer = null;
            let tie = false;
            
            if (gameData.votes) {
                for (const [playerId, voteCount] of Object.entries(gameData.votes)) {
                    if (voteCount > maxVotes) {
                        maxVotes = voteCount;
                        eliminatedPlayer = playerId;
                        tie = false;
                    } else if (voteCount === maxVotes && voteCount > 0) {
                        tie = true;
                    }
                }
            }
            
            const currentLog = Array.isArray(gameData.log) ? gameData.log : [gameData.log];
            const newLog = [...currentLog];
            
            if (eliminatedPlayer && maxVotes > 0 && !tie) {
                const player = gameData.players[eliminatedPlayer];
                await ref.child(`players/${eliminatedPlayer}/alive`).set(false);
                newLog.push(`🗳️ ${player.name} был исключен (${maxVotes} голосов). Роль: ${player.role}`);
                speak(`${player.name} был исключен из игры. Его роль: ${player.role}`);
            } else if (tie) {
                newLog.push('🗳️ Голоса разделились поровну. Никто не был исключен.');
                speak('Голоса разделились поровну. Никто не был исключен.');
            } else {
                newLog.push('Никто не был исключен');
                speak('Никто не был исключен из игры.');
            }
            
            const updatedGame = await ref.once('value');
            const game = updatedGame.val();
            const aliveMafia = Object.values(game.players).filter(p => p.role === 'Мафия' && p.alive).length;
            const aliveCivilians = Object.values(game.players).filter(p => p.role !== 'Мафия' && p.alive).length;
            
            if (aliveMafia === 0) {
                await ref.update({ phase: 'finished', log: [...newLog, '🎉 Мирные жители победили!'] });
                speak('Мирные жители победили! Поздравляем!');
            } else if (aliveMafia >= aliveCivilians) {
                await ref.update({ phase: 'finished', log: [...newLog, ' Мафия победила!'] });
                speak('Мафия победила! Город в их руках.');
            } else {
                setTimeout(async () => {
                    playSound('night');
                    speak('Наступает ночь. Город засыпает.');
                    await ref.update({
                        phase: 'night',
                        day: game.day + 1,
                        activeAction: 'mafia',
                        mafiaVote: null,
                        doctorVote: null,
                        detectiveVote: null,
                        detectiveActionDone: false,
                        detectiveResultSeen: false,
                        votes: {},
                        lastActionAt: 0,
                        log: [...newLog, ` Ночь ${game.day + 1}`, ' Мафия просыпается']
                    });
                }, 5000);
            }
        }

        function showFinalResults(game) {
            const mafiaCount = Object.values(game.players).filter(p => p.role === 'Мафия' && p.alive).length;
            const winnerText = mafiaCount === 0 ? 'Мирные жители победили! 🎉' : 'Мафия победила! 🔪';
            document.getElementById('winnerTitle').textContent = winnerText;
            
            document.getElementById('finalRoles').innerHTML = Object.values(game.players).map(p => {
                let roleClass = '';
                if (p.role === 'Мафия') roleClass = 'mafia';
                else if (p.role === 'Доктор') roleClass = 'doctor';
                else if (p.role === 'Детектив') roleClass = 'detective';
                
                return `
                    <div class="final-role-item ${roleClass}">
                        <div>
                            <div class="player-name">${p.name}</div>
                            <div class="player-role">${ROLE_ICONS[p.role] || ''} ${p.role}</div>
                        </div>
                        <div class="player-status">${p.alive ? '✅ Жив' : '💀 Мертв'}</div>
                    </div>
                `;
            }).join('');
            
            // ИСПРАВЛЕНИЕ: Озвучка ролей всех игроков в конце
            setTimeout(() => {
                const rolesText = Object.values(game.players).map(p => {
                    const status = p.alive ? 'жив' : 'мёртв';
                    return `${p.name} - ${p.role}, ${status}`;
                }).join('. ');
                
                speak(`${winnerText}. Итоги: ${rolesText}.`);
            }, 1500);
        }

        async function startGame() {
            if (!gameData) { alert('Данные игры не загружены!'); return; }
            if (myPlayerId !== gameData.hostId) { alert('Только хост может начать!'); return; }
            const playerCount = Object.keys(gameData.players).length;
            if (playerCount < 4) { alert('Нужно минимум 4 игрока!'); return; }

            voiceEnabled = document.getElementById('voiceEnabled').checked;
            soundEnabled = document.getElementById('soundEnabled').checked;
            initAudio();

            try {
                const ref = database.ref(`games/${currentGameId}`);
                const roles = distributeRoles(playerCount);
                const players = Object.keys(gameData.players);

                await ref.child('phase').set('role_reveal');
                for (let i = 0; i < players.length; i++) {
                    await ref.child(`players/${players[i]}/role`).set(roles[i]);
                }

                setTimeout(async () => {
                    try {
                        playSound('night');
                        speak('Наступает ночь. Город засыпает');
                        await ref.update({
                            phase: 'night',
                            day: 1,
                            activeAction: 'mafia',
                            lastActionAt: 0,
                            detectiveActionDone: false,
                            detectiveResultSeen: false,
                            log: ['🌙 Наступает ночь. Город засыпает.', '🔪 Мафия просыпается']
                        });
                        setTimeout(() => {
                            speak('Просыпается мафия');
                        }, 1000);
                    } catch (e) { console.error(e); }
                }, 15000);
            } catch (e) { alert('Ошибка: ' + e.message); }
        }

        function distributeRoles(playerCount) {
            const mafiaCount = Math.max(1, Math.floor(playerCount / 3));
            const roles = ['Доктор', 'Детектив'];
            for (let i = 0; i < mafiaCount; i++) roles.push('Мафия');
            while (roles.length < playerCount) roles.push('Мирный житель');
            return roles.sort(() => Math.random() - 0.5);
        }

        document.addEventListener('click', (e) => {
            const settings = document.querySelector('.in-game-settings');
            const dropdown = document.getElementById('settingsDropdown');
            if (settings && !settings.contains(e.target)) {
                dropdown?.classList.remove('show');
            }
        });

        window.addEventListener('beforeunload', () => {
            if (gameListener && currentGameId) {
                database.ref(`games/${currentGameId}`).off('value', gameListener);
            }
            if (detectiveResultTimer) clearInterval(detectiveResultTimer);
            if (votingTimer) clearTimeout(votingTimer);
            if (roleTimeoutTimer) clearTimeout(roleTimeoutTimer);
        });
    </script>
</body>
</html>
